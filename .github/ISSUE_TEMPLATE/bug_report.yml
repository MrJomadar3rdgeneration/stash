name: Bug report
description: Report a reproducible problem in Stash.
body:
  - type: markdown
    attributes:
      value: "Do not include real clipboard history, passwords, API keys, or your Keychain. Reproduce with fictional text and redact screenshots."
  - type: input
    id: version
    attributes:
      label: Stash version and macOS version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the source/destination app names and the clipboard format, using fictional content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
